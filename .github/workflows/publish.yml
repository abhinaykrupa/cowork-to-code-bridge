name: Build & publish

# On a version tag: build the sdist + wheel, check them, and attach both to the
# GitHub release — a versioned `pip install <wheel URL>` that needs no PyPI.
#
# The PyPI upload itself is OFF until the maintainer configures a Trusted
# Publisher on pypi.org and sets the repository variable PYPI_PUBLISH=true
# (Settings → Secrets and variables → Actions → Variables). Until then that job
# is skipped rather than failed, so releases don't carry a red run for a step
# that was never set up.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach dist files to the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may be published a few minutes after the tag is pushed.
          for i in $(seq 1 60); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" dist/* --clobber
              exit 0
            fi
            sleep 10
          done
          echo "::notice::No GitHub release for $GITHUB_REF_NAME after 10 min; dist kept as a workflow artifact."

  pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
